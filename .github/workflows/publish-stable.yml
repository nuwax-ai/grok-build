# Publish a STABLE release to npm, then create a GitHub Release with binaries.
#
# Triggered by tags matching `v*` (e.g. v0.2.115). The `if` guard skips beta
# tags (which also match `v*`) so beta and stable workflows never both fire.
# - `publish`: builds + publishes all packages with the `latest` dist-tag.
# - `release`: downloads the per-platform binaries (uploaded as artifacts by the
#   build) and attaches them to a GitHub Release on the tag.
#
#   npm install -g @nuwax-ai/nuwax-grok

name: publish-stable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # the release job needs this to create the GitHub Release

jobs:
  publish:
    if: ${{ !contains(github.ref_name, '-beta') }}
    uses: ./.github/workflows/_build-and-publish.yml
    with:
      npm-tag: latest
    secrets: inherit

  release:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: nuwax-grok-*

      - name: Flatten and rename binaries
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd assets
          VER="${VER#v}"
          for d in */; do
            plat="${d%/}"                  # e.g. nuwax-grok-linux-x64
            short="${plat#nuwax-grok-}"    # e.g. linux-x64
            if   [ -f "$d/grok.exe" ]; then mv "$d/grok.exe" "nuwax-grok-${VER}-${short}.exe"
            elif [ -f "$d/grok" ];     then mv "$d/grok"     "nuwax-grok-${VER}-${short}"
            else echo "::warning::no binary found under $plat"; fi
          done
          rm -rf */
          echo "--- release assets ---"
          ls -la

      - name: Create GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: assets/*
